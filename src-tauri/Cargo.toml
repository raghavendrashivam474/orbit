[package]
name         = "orbit"
version      = "0.1.0"
description  = "Orbit"
authors      = ["Orbit Contributors"]
edition      = "2021"
rust-version = "1.77"

[lib]
name       = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "orbit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-log   = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = 3
strip         = true
